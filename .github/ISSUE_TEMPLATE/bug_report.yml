name: Bug report
description: Report a runtime failure or incorrect scheduling behavior.
title: "[Bug] "
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment and revision
      description: Include the Git commit, operating system and output of python tools/doctor.py.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the exact command and the smallest workload/configuration that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Include the relevant traceback, solver message or incorrect table values.
    validations:
      required: true
