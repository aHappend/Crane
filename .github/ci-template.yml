name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - run: python -m pip check
      - run: python tools/doctor.py
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python example/quickstart.py --output-dir outputs/experiments/ci-quickstart
      - uses: actions/upload-artifact@v4
        with:
          name: quickstart-${{ matrix.os }}-py${{ matrix.python }}
          path: outputs/experiments/ci-quickstart/
